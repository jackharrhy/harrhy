[package]
name = "private-hosting"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
socket2 = "0.6"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "lifecycle"
path = "__tests__/lifecycle.rs"
