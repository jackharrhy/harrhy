name: Garden image
on:
  pull_request:
    paths:
      - .github/workflows/garden-image.yml
      - .github/workflows/publish-garden.yml
      - .dockerignore
      - .nvmrc
      - tsconfig.base.json
      - package.json
      - package-lock.json
      - apps/garden/**
      - packages/ui/**
  workflow_dispatch:
concurrency:
  group: garden-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: docker build --tag garden-smoke --file apps/garden/Dockerfile .
      - run: node apps/garden/__tests__/image-smoke.mjs garden-smoke
