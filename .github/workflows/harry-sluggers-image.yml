name: Harry Sluggers image
on:
  pull_request:
    paths:
      - .github/workflows/harry-sluggers-image.yml
      - .dockerignore
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - apps/harry-sluggers/**
      - packages/ui/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harry-sluggers-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t harry-sluggers-check -f apps/harry-sluggers/Dockerfile .
      - name: Missing database configuration fails closed
        run: |
          if docker run --rm harry-sluggers-check > startup.log 2>&1; then
            echo "Unexpected startup without a database" >&2
            exit 1
          fi
          grep -q 'HARRHY_SLUGGERS_DATABASE_URL is required' startup.log
