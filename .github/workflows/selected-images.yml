name: Selected runtime images
on:
  pull_request:
    paths:
      - .github/workflows/selected-images.yml
      - scripts/ci/selected-image-smoke.mjs
      - celld.json
      - .dockerignore
      - .npmrc
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - apps/ref/**
      - apps/radio/**
      - apps/worldview/**
      - apps/maps-collaboration/**
      - apps/burger/**
      - apps/gurgur/**
      - apps/pool/**
      - packages/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selected-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [ref, radio, worldview, maps-collaboration, burger, gurgur, pool]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build production image
        env:
          APP: ${{ matrix.app }}
        run: docker build --tag selected-smoke --file "apps/$APP/Dockerfile" .
      - name: Check default CMD, assets, compiler, SQLite and restart
        env:
          APP: ${{ matrix.app }}
        run: node scripts/ci/selected-image-smoke.mjs "$APP" selected-smoke
