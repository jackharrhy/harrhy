name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Public workspace to publish
        required: true
        type: choice
        options:
          - "@harrhy/schmovement"
          - "@harrhy/worldview-renderer"
          - "@harrhy/artbin"
concurrency:
  group: publish-npm-${{ inputs.package }}
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tooling:check
      - env:
          PACKAGE: ${{ inputs.package }}
        run: |
          pnpm --filter "$PACKAGE" --fail-if-no-match run check
          pnpm --filter "$PACKAGE" --fail-if-no-match run build
          pnpm --filter "$PACKAGE" --fail-if-no-match exec npm pack --dry-run --json > "$RUNNER_TEMP/package.json"
          PACKAGE="$PACKAGE" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const [packed] = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (packed?.name !== process.env.PACKAGE) throw new Error("Wrong package packed");
          ' "$RUNNER_TEMP/package.json"
      - env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm --filter "$PACKAGE" --fail-if-no-match exec npm publish --access public --provenance
